name: Verify DSBench saved results

on:
  push:
    paths:
      - "show_result.py"
      - "data.json"
      - "save_performance/**"
      - "output_model/**"
      - "requirements.txt"
      - "team3_work/**"
      - ".github/workflows/verify-dsbench.yml"
  workflow_dispatch:

jobs:
  saved-results:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install -r requirements.txt
      - name: Run official saved-result check
        run: python team3_work/verify_official_demo.py
      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: dsbench-verification-report
          path: team3_work/verification_output.json

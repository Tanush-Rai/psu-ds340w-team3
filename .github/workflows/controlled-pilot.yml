name: Run controlled reliability pilot

on:
  push:
    paths:
      - "experiments/**"
      - "results/**"
      - ".github/workflows/controlled-pilot.yml"
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pilot
        run: python experiments/run_pilot.py
      - name: Verify saved comparison
        run: git diff --ignore-space-at-eol --exit-code -- results/comparison.csv
      - name: Export and evaluate complete 20-task set
        run: python experiments/final_evaluation.py
      - name: Verify complete evaluation and dataset files
        run: git diff --ignore-space-at-eol --exit-code -- results/synthetic_rows_240.csv results/full_task_predictions.csv results/full_evaluation.csv
      - name: Unit tests
        working-directory: experiments
        run: python -m unittest discover -v
      - name: Save outputs
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-pilot-results
          path: results/
